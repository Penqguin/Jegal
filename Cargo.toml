[package]
name = "jegal"
version = "0.1.0"
edition = "2021"

[lib]
name = "_lib"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module", "serde"] }
arrow = { version = "53.0.0", features = ["ffi"] }
arrow-array = "53.0.0"
arrow-schema = "53.0.0"
arrow-data = "53.0.0"
tokio = { version = "1.0", features = ["full"] }
secrecy = { version = "0.8", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
# Note: Using placeholder/latest known crates for IBKR and Questrade integration
# In a real scenario, these would be the specific crates found on crates.io
ibapi = "0.1" 
questrade-client = "0.1"
async-trait = "0.1"

[dev-dependencies]
# Add dev dependencies here
