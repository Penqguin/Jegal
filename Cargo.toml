[package]
name = "jegal"
version = "0.1.0"
edition = "2021"

[lib]
name = "_lib"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["serde", "auto-initialize"] }
arrow = { version = "53.0.0", features = ["ffi"] }
arrow-array = "53.0.0"
arrow-schema = "53.0.0"
arrow-data = "53.0.0"
tokio = { version = "1.0", features = ["full"] }
secrecy = { version = "0.8", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1"
byteorder = "1.5.0"
dashmap = "6.1.0"

[dev-dependencies]
mockall = "0.12"

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]
