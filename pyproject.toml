[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "jegal"
version = "0.1.0"
description = "A high-performance Python/Rust hybrid trading bot"
requires-python = ">=3.8"
dependencies = [
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
authors = [
    { name = "Michael Maddison" },
]
readme = "README.md"
license = { text = "MIT" }

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "jegal._lib"
